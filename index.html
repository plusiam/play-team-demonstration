<!-- 팀 데몬스트레이션 진행 도구 — 사회자(교사)용 단일 화면 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팀 데몬스트레이션 진행 도구</title>
<style>
  /* ===== 기본 ===== */
  :root {
    --bg: #14181f;
    --panel: #1e242e;
    --panel-2: #262e3a;
    --line: #38414f;
    --text: #eef2f7;
    --dim: #97a3b4;
    --accent: #ffcf4a;
    --accent-2: #4ade80;
    --danger: #f87171;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  /* 교실 TV 투사용 — 화면 세로를 끝까지 쓴다.
     아래가 비면 그만큼 글씨를 키울 수 있었다는 뜻이다. */
  .wrap {
    max-width: 1600px; margin: 0 auto; padding: clamp(12px, 2vw, 28px);
    min-height: 100vh; display: flex; flex-direction: column;
  }
  .wrap > section { flex: 1; display: flex; flex-direction: column; }
  .hidden { display: none !important; }

  /* ===== 공통 버튼 ===== */
  button {
    font-family: inherit;
    font-size: clamp(0.95rem, 1.3vw, 1.25rem);
    font-weight: 600;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 0.7em 1.1em;
    cursor: pointer;
    transition: transform .08s, background .15s, opacity .15s;
  }
  button:hover:not(:disabled) { background: #303a48; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button.primary { background: var(--accent); color: #1a1400; border-color: var(--accent); }
  button.primary:hover:not(:disabled) { background: #ffd869; }
  button.ghost { background: transparent; }
  button.danger { color: var(--danger); }

  input[type="text"], input[type="number"] {
    font-family: inherit;
    font-size: clamp(1rem, 1.5vw, 1.4rem);
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 0.6em 0.8em;
    width: 100%;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  label { color: var(--dim); font-size: 0.95rem; display: block; margin-bottom: 0.4em; }

  /* ===== 설정 화면 ===== */
  #setup h1 { font-size: clamp(1.6rem, 3.5vw, 2.6rem); margin: 0 0 0.2em; }
  #setup .sub { color: var(--dim); margin: 0 0 2em; line-height: 1.6; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: clamp(16px, 2.5vw, 28px);
    margin-bottom: 18px;
  }
  .card h2 { font-size: clamp(1.05rem, 1.6vw, 1.3rem); margin: 0 0 1em; }
  .choice-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .choice {
    background: var(--panel-2); border: 2px solid var(--line);
    border-radius: var(--radius); padding: 0.7em 1.3em;
    font-weight: 700; font-size: clamp(1rem, 1.4vw, 1.2rem);
  }
  .choice[aria-pressed="true"] { border-color: var(--accent); background: #3a3320; color: var(--accent); }
  .choice small { display: block; font-weight: 400; font-size: 0.78em; color: var(--dim); margin-top: 2px; }
  .choice[aria-pressed="true"] small { color: #cbb87c; }
  .team-inputs { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }

  /* ===== 진행 화면 ===== */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; }
  .progress-label { font-size: clamp(1rem, 1.6vw, 1.5rem); font-weight: 700; color: var(--dim); }
  .progress-label b { color: var(--text); }
  .bonus-banner {
    font-size: clamp(1rem, 1.6vw, 1.5rem); font-weight: 800;
    color: #1a1400; background: var(--accent);
    padding: 0.35em 0.9em; border-radius: 999px;
  }
  .bar { display: flex; gap: 5px; margin-bottom: 16px; }
  .bar span { flex: 1; height: 8px; border-radius: 4px; background: var(--panel-2); }
  .bar span.done { background: var(--accent-2); }
  .bar span.now { background: var(--accent); }

  .prompt-box {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: clamp(18px, 3vw, 40px); text-align: center; margin-bottom: 16px;
    flex: 1;                                   /* 남는 세로 공간을 조건문이 흡수한다 */
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .prompt-box .text {
    /* 가로뿐 아니라 세로도 본다 — 넓고 낮은 TV에서 글자가 넘치지 않게 */
    font-size: clamp(1.8rem, min(6.4vw, 13vh), 7.5rem);
    font-weight: 800; line-height: 1.25; word-break: keep-all;
  }
  .prompt-box .set-tag {
    display: inline-block; margin-bottom: 0.6em; color: var(--dim);
    font-size: clamp(0.8rem, 1.1vw, 1rem); letter-spacing: .05em;
  }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip {
    font-size: clamp(0.9rem, 1.4vw, 1.3rem); font-weight: 700;
    padding: 0.5em 0.95em; border-radius: 999px;
    background: var(--panel-2); border: 1px solid var(--line);
  }
  .chip .pt { color: var(--accent); margin-left: 0.5em; font-size: 0.85em; }
  .chip .hint { color: var(--dim); font-weight: 400; font-size: 0.8em; margin-left: 0.35em; }
  .chip.used { opacity: .3; text-decoration: line-through; }
  .chip.used .pt { color: var(--dim); }

  .score-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 14px; }
  .score-row .f-answer { flex: 1 1 260px; }
  .score-row .f-points { flex: 0 0 130px; }

  /* 보너스 점수 고르기 — 투사 중에 화면을 덮지 않도록 대화상자 대신 인라인으로 */
  .bonus-pick {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: #3a3320; border: 1px solid var(--accent);
    border-radius: var(--radius); padding: 10px 14px; margin-bottom: 14px;
  }
  .bonus-pick .lbl { color: var(--accent); font-weight: 700; font-size: clamp(0.9rem, 1.3vw, 1.15rem); }
  .bonus-pick input { width: 110px; }

  .used-line {
    color: var(--dim); font-size: clamp(0.85rem, 1.2vw, 1.1rem);
    margin-bottom: 18px; min-height: 1.5em; line-height: 1.7; word-break: keep-all;
  }
  .used-line b { color: var(--text); font-weight: 700; }
  .used-line .b-mark { color: var(--accent); }

  .teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .team {
    background: var(--panel); border: 3px solid var(--line); border-radius: var(--radius);
    padding: clamp(10px, 1.6vw, 20px); text-align: center; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .team[aria-pressed="true"] { border-color: var(--accent); background: #33301f; }
  .team .name {
    font-size: clamp(1rem, 1.6vw, 1.6rem); font-weight: 700;
    margin-bottom: 0.2em; word-break: keep-all;
  }
  .team .score { font-size: clamp(1.5rem, min(3.4vw, 7vh), 3.6rem); font-weight: 800; font-variant-numeric: tabular-nums; }
  @keyframes flash { 0%,100% { background: var(--panel); } 30% { background: #4a5c33; } }
  .team.flash { animation: flash .55s ease; }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; }
  .controls .spacer { flex: 1; }

  /* ===== 결과 화면 ===== */
  #result h1 { font-size: clamp(1.6rem, 3.5vw, 2.6rem); margin: 0 0 1em; }
  .rank { display: flex; align-items: baseline; gap: 14px; margin-bottom: 6px; }
  .rank .no { font-size: clamp(1.2rem, 2vw, 2rem); font-weight: 800; color: var(--accent); min-width: 1.6em; }
  .rank .nm { font-size: clamp(1.15rem, 2vw, 2rem); font-weight: 700; }
  .rank .sc { font-size: clamp(1.15rem, 2vw, 2rem); font-weight: 800; margin-left: auto; font-variant-numeric: tabular-nums; }
  .card.top { border-color: var(--accent); }
  .breakdown { color: var(--dim); font-size: clamp(0.85rem, 1.2vw, 1.05rem); line-height: 1.8; word-break: keep-all; }
  .breakdown .b-mark { color: var(--accent); font-weight: 700; }
  .breakdown .none { font-style: italic; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px;
    padding: 0.7em 1.4em; font-weight: 600; opacity: 0; pointer-events: none;
    transition: opacity .2s; z-index: 50;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 520px) {
    .score-row .f-points { flex: 1 1 100px; }
    .controls button { flex: 1 1 auto; }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== 설정 화면 ===== -->
  <section id="setup">
    <h1>팀 데몬스트레이션</h1>
    <p class="sub">
      사회자가 조건문을 던지고, 답과 점수를 부르고, 손 든 모둠에 점수를 얹는 도구.<br>
      모둠과 칸 수를 정하면 바로 시작합니다.
    </p>

    <div class="card">
      <h2>모둠 수</h2>
      <div class="choice-row" id="teamCountRow"></div>
    </div>

    <div class="card">
      <h2>모둠 이름</h2>
      <div class="team-inputs" id="teamNameRow"></div>
    </div>

    <div class="card">
      <h2>칸 수</h2>
      <div class="choice-row" id="cellRow"></div>
    </div>

    <div class="controls">
      <button class="primary" id="btnStart">시작하기</button>
      <button class="ghost" id="btnResume">이어서 하기</button>
    </div>
  </section>

  <!-- ===== 진행 화면 ===== -->
  <section id="play" class="hidden">
    <div class="topbar">
      <div class="progress-label">조건 <b id="curNo">1</b> / <span id="totalNo">6</span></div>
      <div class="bonus-banner hidden" id="bonusBanner"></div>
    </div>
    <div class="bar" id="bar"></div>

    <div class="prompt-box">
      <div class="set-tag" id="setTag"></div>
      <div class="text" id="promptText"></div>
    </div>

    <div class="chips" id="chips"></div>

    <div class="score-row">
      <div class="f-answer">
        <label for="inAnswer">답</label>
        <input type="text" id="inAnswer" placeholder="부른 답" autocomplete="off">
      </div>
      <div class="f-points">
        <label for="inPoints">점수</label>
        <input type="number" id="inPoints" value="50" step="10" min="0">
      </div>
      <button class="primary" id="btnApply">반영</button>
      <button class="primary hidden" id="btnBonusApply"></button>
    </div>

    <div class="bonus-pick hidden" id="bonusPick">
      <span class="lbl">숨은 보너스 점수</span>
      <button data-bp="200">200</button>
      <button data-bp="300">300</button>
      <input type="number" id="inBonus" value="300" step="50" min="1">
      <button class="primary" data-bp="custom">걸기</button>
      <button class="ghost" data-bp="cancel">닫기</button>
    </div>

    <div class="used-line" id="usedLine"></div>

    <div class="teams" id="teams"></div>

    <div class="controls">
      <button id="btnPrev">‹ 이전</button>
      <button class="primary" id="btnNext">다음 조건 ›</button>
      <button id="btnBonus">★ 보너스</button>
      <span class="spacer"></span>
      <button id="btnUndo">되돌리기</button>
      <button id="btnResult">결과</button>
      <button class="ghost danger" id="btnReset">새 판</button>
    </div>
  </section>

  <!-- ===== 결과 화면 ===== -->
  <section id="result" class="hidden">
    <h1>결과</h1>
    <div id="resultList"></div>
    <div class="controls">
      <button class="primary" id="btnBack">진행으로 돌아가기</button>
      <button class="ghost danger" id="btnReset2">새 판 시작</button>
    </div>
  </section>

</div>
<div class="toast" id="toast"></div>

<script>
'use strict';

/* ============================================================
   1. 프리셋 — 기획서 §6
   점수는 30(흔함) / 50(웬만함) / 100(드묾) 세 단계.
   정답지는 정답 판정용이 아니라 사회자의 점수 힌트다.
   ============================================================ */
const PRESETS = [
  { id:'p1', set:'몸풀기', text:'ㄱ으로 시작하는 동물', answers:[
    {word:'개'},{word:'고양이'},{word:'곰'},
    {word:'고래',p:50},{word:'거북',p:50},{word:'개구리',p:50},
    {word:'기린',p:100},{word:'까치',p:100},{word:'게',p:100},{word:'가재',p:100} ]},
  { id:'p2', set:'몸풀기', text:'ㅁ으로 시작하는 음식', answers:[
    {word:'만두'},{word:'미역국'},
    {word:'물냉면',p:50},{word:'마라탕',p:50},{word:'무',p:50},
    {word:'멸치',p:100},{word:'마늘',p:100},{word:'매생이',p:100},{word:'묵',p:100} ]},
  { id:'p3', set:'몸풀기', text:'교실에서 볼 수 있는 것', answers:[
    {word:'책상'},{word:'의자'},{word:'칠판'},
    {word:'사물함',p:50},{word:'시계',p:50},{word:'컴퓨터',p:50},
    {word:'소화기',p:100},{word:'화분',p:100},{word:'우산꽂이',p:100},{word:'콘센트',p:100} ]},
  { id:'p4', set:'몸', text:'노란색인 것', answers:[
    {word:'바나나'},{word:'병아리'},
    {word:'개나리',p:50},{word:'레몬',p:50},{word:'참외',p:50},
    {word:'은행잎',p:100},{word:'택시',p:100},{word:'안전모',p:100},{word:'유치원 버스',p:100} ]},
  { id:'p5', set:'몸풀기', text:'바다에 사는 동물', answers:[
    {word:'상어'},{word:'문어'},{word:'고래'},
    {word:'오징어',p:50},{word:'게',p:50},{word:'새우',p:50},
    {word:'해파리',p:100},{word:'불가사리',p:100},{word:'말미잘',p:100},{word:'성게',p:100} ]},
  { id:'p6', set:'다문화', text:'두 글자 나라 이름', answers:[
    {word:'미국'},{word:'일본'},{word:'중국'},
    {word:'태국',p:50},{word:'인도',p:50},{word:'영국',p:50},
    {word:'호주',p:100},{word:'독일',p:100},{word:'몽골',p:100},{word:'케냐',p:100} ]},
  { id:'p7', set:'다문화', text:'인사말을 아는 나라', answers:[
    {word:'미국',hint:'헬로'},{word:'일본',hint:'곤니치와'},
    {word:'중국',p:50,hint:'니하오'},{word:'베트남',p:50,hint:'신짜오'},
    {word:'태국',p:100,hint:'사와디'},{word:'몽골',p:100,hint:'샌배노'},{word:'필리핀',p:100,hint:'쿠무스타'} ]},
  { id:'p8', set:'다문화', text:'먹어 본 다른 나라 음식', answers:[
    {word:'피자'},{word:'스파게티'},
    {word:'쌀국수',p:50},{word:'초밥',p:50},{word:'카레',p:50},
    {word:'타코',p:100},{word:'케밥',p:100},{word:'반미',p:100},{word:'팟타이',p:100} ]},
  { id:'p9', set:'다문화', text:'국기에 빨간색이 있는 나라', answers:[
    {word:'대한민국'},{word:'일본'},
    {word:'중국',p:50},{word:'미국',p:50},{word:'베트남',p:50},
    {word:'캐나다',p:100},{word:'태국',p:100},{word:'튀르키예',p:100},{word:'싱가포르',p:100} ]},
  { id:'p10', set:'몸', text:'몸으로 낼 수 있는 소리', answers:[
    {word:'박수'},{word:'발 구르기'},
    {word:'휘파람',p:50},{word:'무릎 치기',p:50},
    {word:'손가락 튕기기',p:100},{word:'혀 차기',p:100},{word:'볼 두드리기',p:100} ]}
];
// 위 데이터에서 p를 안 적은 답은 30점 (흔한 답)
PRESETS.forEach(pr => pr.answers.forEach(a => { a.p = a.p || 30; }));

/* 세트 배분표 — 기획서 §4.3-1
   어느 칸 수에서도 「몸」 세트가 최소 1개 들어가야 한다. */
const QUOTAS = {
  4: { 몸풀기: 2, 몸: 1, 다문화: 1 },
  6: { 몸풀기: 2, 몸: 1, 다문화: 3 },
  8: { 몸풀기: 3, 몸: 2, 다문화: 3 }
};
const SET_ORDER = ['몸풀기', '몸', '다문화'];   // 앞 · 가운데 · 뒤

/* ============================================================
   2. 상태 — 기획서 §5
   history가 점수의 유일한 출처다. teams[].score는 저장하지 않는다.
   ============================================================ */
const STORAGE_KEY = 'team-demo-state';
let state = null;

/* 화면에만 쓰는 임시값 — 저장하지 않는다 */
let selected = new Set();   // 지금 고른 모둠
let lastPoints = 50;        // 점수 최근 사용값

function newState(teamNames, cells) {
  return {
    teams: teamNames.map((n, i) => ({ id: 't' + (i + 1), name: n })),
    cells,
    currentIndex: 0,
    bonus: null,
    prompts: pickPrompts(cells),
    history: []
  };
}

/* 칸 수만큼 뽑되 세트 배분표를 지킨다. 섞기는 세트 안에서만 돈다. */
function pickPrompts(cells) {
  const quota = QUOTAS[cells];
  const out = [];
  SET_ORDER.forEach(setName => {
    const pool = PRESETS.filter(p => p.set === setName);
    out.push(...shuffle(pool).slice(0, quota[setName]));
  });
  return JSON.parse(JSON.stringify(out));   // 직접 채점으로 정답지가 바뀌므로 깊은 복사
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---- 저장 · 불러오기 : 실패해도 조용히 넘어간다 (수업 중 alert 금지) ---- */
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch (e) { /* 시크릿 모드·저장 차단 — 무시하고 계속 진행 */ }
}
function loadSaved() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || !Array.isArray(s.teams) || !Array.isArray(s.history)) return null;
    return s;
  } catch (e) { return null; }
}
function clearSaved() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
}

/* ============================================================
   3. 파생값 — 화면 상태는 전부 history에서 계산한다
   별도 플래그를 두면 되돌리기가 점수만 되살리고 칩은 죽은 채 남는다.
   ============================================================ */
const scoreOf = id =>
  state.history.filter(h => h.teamIds.includes(id))
               .reduce((sum, h) => sum + h.points, 0);

const usedHere = () => state.history.filter(h => h.index === state.currentIndex);

const isUsed = word => usedHere().some(h => h.answer === word);

const curPrompt = () => state.prompts[state.currentIndex];

/* ============================================================
   4. 화면 그리기
   ============================================================ */
const $ = id => document.getElementById(id);

function show(name) {
  ['setup', 'play', 'result'].forEach(s => $(s).classList.toggle('hidden', s !== name));
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 1600);
}

/* ---- 진행 화면 ---- */
function renderPlay() {
  const p = curPrompt();

  $('curNo').textContent = state.currentIndex + 1;
  $('totalNo').textContent = state.cells;

  // 진행 바
  $('bar').innerHTML = state.prompts.map((_, i) =>
    `<span class="${i < state.currentIndex ? 'done' : i === state.currentIndex ? 'now' : ''}"></span>`
  ).join('');

  // 조건문
  $('setTag').textContent = p.set + ' 세트';
  $('promptText').textContent = p.text;

  // 보너스 배너
  const bonusOn = state.bonus && state.bonus.promptIndex === state.currentIndex;
  $('bonusBanner').classList.toggle('hidden', !bonusOn);
  if (bonusOn) $('bonusBanner').textContent = `★ 숨은 보너스 ${state.bonus.points}점`;
  $('btnBonusApply').classList.toggle('hidden', !bonusOn);
  if (bonusOn) $('btnBonusApply').textContent = `★ 보너스 ${state.bonus.points}점 반영`;
  $('btnBonus').textContent = bonusOn ? '★ 보너스 취소' : '★ 보너스';

  // 정답 칩 — 부른 답은 회색 (history에서 판단)
  $('chips').innerHTML = p.answers.map((a, i) =>
    `<button class="chip ${isUsed(a.word) ? 'used' : ''}" data-chip="${i}">` +
    `${esc(a.word)}${a.hint ? `<span class="hint">${esc(a.hint)}</span>` : ''}` +
    `<span class="pt">${a.p}</span></button>`
  ).join('');

  // 나온 답 줄
  const used = usedHere();
  $('usedLine').innerHTML = used.length
    ? '나온 답 ▸ ' + used.map(h =>
        `<b>${esc(h.answer)}</b> ${h.bonus ? '<span class="b-mark">★</span>' : ''}${h.points}`
      ).join(' · ')
    : '<span style="opacity:.5">아직 나온 답이 없습니다.</span>';

  // 모둠 카드
  $('teams').innerHTML = state.teams.map(t =>
    `<div class="team" role="button" tabindex="0" aria-pressed="${selected.has(t.id)}" data-team="${t.id}">` +
    `<div class="name">${esc(t.name)}</div><div class="score">${scoreOf(t.id)}</div></div>`
  ).join('');

  $('btnPrev').disabled = state.currentIndex === 0;
  $('btnNext').disabled = state.currentIndex >= state.cells - 1;
  $('btnUndo').disabled = state.history.length === 0;
  $('inPoints').value = lastPoints;
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
}

/* ---- 결과 화면 ---- */
function renderResult() {
  const rows = state.teams
    .map(t => ({ ...t, score: scoreOf(t.id) }))
    .sort((a, b) => b.score - a.score);

  // 기획서 §9 — 3모둠 이하는 등수 강조 없이 전원 나열,
  // 4모둠 이상은 상위 3모둠만 강조하고 나머지는 등수 없이 획득 내역만.
  const emphasize = state.teams.length >= 4;

  $('resultList').innerHTML = rows.map((t, i) => {
    const top = emphasize && i < 3;
    const no = emphasize ? (top ? `${i + 1}` : '·') : '·';
    const got = state.history.filter(h => h.teamIds.includes(t.id));
    const detail = got.length
      ? got.map(h =>
          `${h.index + 1}번 · ${esc(h.prompt)} ▸ <b style="color:var(--text)">${esc(h.answer)}</b> ` +
          `${h.bonus ? '<span class="b-mark">★</span>' : ''}${h.points}점`
        ).join('<br>')
      : '<span class="none">획득한 점수가 없습니다.</span>';

    return `<div class="card ${top ? 'top' : ''}">
      <div class="rank"><span class="no">${no}</span>
        <span class="nm">${esc(t.name)}</span><span class="sc">${t.score}</span></div>
      <div class="breakdown">${detail}</div>
    </div>`;
  }).join('');
}

/* ============================================================
   5. 동작
   ============================================================ */

/* ---- 채점 반영 ---- */
function apply(isBonus) {
  const answer = $('inAnswer').value.trim();
  const points = isBonus ? state.bonus.points : Number($('inPoints').value);

  if (!answer) { toast('답을 입력하세요.'); $('inAnswer').focus(); return; }
  if (!selected.size) { toast('손 든 모둠을 고르세요.'); return; }
  if (!isBonus && (!Number.isFinite(points) || points <= 0)) { toast('점수를 확인하세요.'); return; }

  // 정답지에 없는 답이면 그 자리에서 정답지에 추가한다 (기획서 §4.1 직접 채점)
  const p = curPrompt();
  if (!p.answers.some(a => a.word === answer)) p.answers.push({ word: answer, p: points });

  state.history.push({
    index: state.currentIndex,
    promptId: p.id,
    prompt: p.text,
    answer,
    points,
    teamIds: [...selected],
    bonus: !!isBonus
  });

  const flashIds = [...selected];
  if (isBonus) state.bonus = null;      // 공개했으므로 배너를 내린다
  else lastPoints = points;

  selected.clear();
  $('inAnswer').value = '';
  save();
  renderPlay();

  flashIds.forEach(id => {
    const el = document.querySelector(`[data-team="${id}"]`);
    if (el) el.classList.add('flash');
  });
  $('inAnswer').focus();
}

/* ---- 이벤트 연결 ---- */
$('chips').addEventListener('click', e => {
  const b = e.target.closest('[data-chip]');
  if (!b) return;
  const a = curPrompt().answers[Number(b.dataset.chip)];
  $('inAnswer').value = a.word;
  $('inPoints').value = a.p;
  lastPoints = a.p;
});

$('teams').addEventListener('click', e => {
  const el = e.target.closest('[data-team]');
  if (!el) return;
  const id = el.dataset.team;
  selected.has(id) ? selected.delete(id) : selected.add(id);
  el.setAttribute('aria-pressed', selected.has(id));
});
$('teams').addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const el = e.target.closest('[data-team]');
  if (!el) return;
  e.preventDefault();
  el.click();
});

$('btnApply').addEventListener('click', () => apply(false));
$('btnBonusApply').addEventListener('click', () => apply(true));
$('inAnswer').addEventListener('keydown', e => { if (e.key === 'Enter') apply(false); });

$('btnNext').addEventListener('click', () => {
  if (state.currentIndex >= state.cells - 1) return;
  state.currentIndex++;
  selected.clear();
  $('bonusPick').classList.add('hidden');
  save(); renderPlay();
});
$('btnPrev').addEventListener('click', () => {
  if (state.currentIndex === 0) return;
  state.currentIndex--;
  selected.clear();
  $('bonusPick').classList.add('hidden');
  save(); renderPlay();
});

/* 되돌리기 — history.pop() 한 줄. 횟수 제한 없음.
   점수·칩·나온 답이 모두 history에서 파생되므로 한 번에 되살아난다. */
$('btnUndo').addEventListener('click', () => {
  if (!state.history.length) return;
  const h = state.history.pop();
  if (h.index !== state.currentIndex) state.currentIndex = h.index;   // 그 조건으로 되돌아간다
  selected.clear();
  save(); renderPlay();
  toast(`되돌림 · ${h.answer} ${h.points}점`);
});

/* 보너스 — 점수만 먼저 걸어 두고 답은 나중에 공개한다 (기획서 §4.4) */
$('btnBonus').addEventListener('click', () => {
  if (state.bonus && state.bonus.promptIndex === state.currentIndex) {
    state.bonus = null;
    $('bonusPick').classList.add('hidden');
    save(); renderPlay();
    toast('보너스를 취소했습니다.');
    return;
  }
  if (!(Number($('inBonus').value) > 0)) $('inBonus').value = 300;   // 잘못된 값이 남아 있으면 되돌린다
  $('bonusPick').classList.toggle('hidden');
});

function armBonus(points) {
  if (!Number.isFinite(points) || points <= 0) { toast('점수를 확인하세요.'); return; }
  state.bonus = { points, promptIndex: state.currentIndex };
  $('bonusPick').classList.add('hidden');
  save(); renderPlay();
}

$('bonusPick').addEventListener('click', e => {
  const b = e.target.closest('[data-bp]');
  if (!b) return;
  const v = b.dataset.bp;
  if (v === 'cancel') { $('bonusPick').classList.add('hidden'); return; }
  armBonus(v === 'custom' ? Number($('inBonus').value) : Number(v));
});
$('inBonus').addEventListener('keydown', e => {
  if (e.key === 'Enter') armBonus(Number($('inBonus').value));
});

$('btnResult').addEventListener('click', () => { renderResult(); show('result'); });
$('btnBack').addEventListener('click', () => { renderPlay(); show('play'); });

/* 새 판 시작 — 1교시 3반 → 2교시 4반이 기본 상황이라 반드시 필요하다 */
function resetAll() {
  if (!confirm('지금까지의 점수가 모두 지워집니다. 새 판을 시작할까요?')) return;
  state = null;
  clearSaved();
  selected.clear();
  lastPoints = 50;
  renderSetup();
  show('setup');
}
$('btnReset').addEventListener('click', resetAll);
$('btnReset2').addEventListener('click', resetAll);

/* ============================================================
   6. 설정 화면
   ============================================================ */
let setupTeamCount = 4;
let setupCells = 6;                     // 기본 6칸 — 40분 한 차시에 맞는다
let setupNames = [];

const CELL_INFO = { 4: '10~14분', 6: '15~21분 · 기본', 8: '20~28분' };

function renderSetup() {
  $('teamCountRow').innerHTML = [2,3,4,5,6,7,8].map(n =>
    `<button class="choice" aria-pressed="${n === setupTeamCount}" data-tc="${n}">${n}모둠</button>`
  ).join('');

  $('cellRow').innerHTML = [4,6,8].map(n =>
    `<button class="choice" aria-pressed="${n === setupCells}" data-cell="${n}">${n}칸<small>${CELL_INFO[n]}</small></button>`
  ).join('');

  $('teamNameRow').innerHTML = Array.from({ length: setupTeamCount }, (_, i) =>
    `<input type="text" data-name="${i}" value="${esc(setupNames[i] || String.fromCharCode(65 + i))}" maxlength="10">`
  ).join('');

  $('btnResume').classList.toggle('hidden', !loadSaved());
}

$('teamCountRow').addEventListener('click', e => {
  const b = e.target.closest('[data-tc]');
  if (!b) return;
  readNames();
  setupTeamCount = Number(b.dataset.tc);
  renderSetup();
});
$('cellRow').addEventListener('click', e => {
  const b = e.target.closest('[data-cell]');
  if (!b) return;
  setupCells = Number(b.dataset.cell);
  renderSetup();
});
function readNames() {
  setupNames = [...document.querySelectorAll('[data-name]')].map(i => i.value);
}

$('btnStart').addEventListener('click', () => {
  readNames();
  const names = Array.from({ length: setupTeamCount }, (_, i) =>
    (setupNames[i] || '').trim() || String.fromCharCode(65 + i));
  state = newState(names, setupCells);
  selected.clear();
  lastPoints = 50;
  save();
  renderPlay();
  show('play');
});

$('btnResume').addEventListener('click', () => {
  const s = loadSaved();
  if (!s) { toast('이어서 할 판이 없습니다.'); return; }
  state = s;
  selected.clear();
  renderPlay();
  show('play');
});

/* ============================================================
   7. 시작
   ============================================================ */
renderSetup();
show('setup');
</script>
</body>
